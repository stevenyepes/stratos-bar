# Security audit ignore list
#
# Consulted by scripts/check-audit-ignores.py from the `test-backend` and
# `test-frontend` CI jobs. See CONTRIBUTING.md ("Security Audits") for the
# rules on adding an entry.
#
# Each [[ignore]] entry silences exactly one advisory ID for one tool until
# its `expires` date. Once that date has passed, the entry is dropped and the
# advisory fails the build again until it is re-triaged (renewed with a new
# `expires`, or actually fixed).

