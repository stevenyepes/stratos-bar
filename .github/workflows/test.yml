name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: |
          npm audit --json > npm-audit.json || true
          python3 scripts/check-audit-ignores.py --tool npm --npm-audit-json npm-audit.json

      - name: Run tests
        run: npm run test -- --run

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify audit-ignore expiry enforcement
        run: python3 scripts/check-audit-ignores.py --self-test

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: src-tauri
        run: |
          IGNORE_ARGS=$(python3 ../scripts/check-audit-ignores.py --tool cargo)
          cargo audit $IGNORE_ARGS

      - name: Run tests
        run: cargo test
        working-directory: src-tauri
