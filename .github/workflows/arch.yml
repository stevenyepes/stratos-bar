name: Arch package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: makepkg -s
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Update system
        run: |
          pacman -Syu --noconfirm
          # mkinitcpio and friends log warnings without a keyring refresh
          pacman-key --init
          pacman-key --populate archlinux

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PKGBUILD's pkgver() runs `git describe --tags` against a clone of
          # this checkout; a shallow one carries no tags.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman -S --needed --noconfirm \
            base-devel git npm cargo nodejs \
            webkit2gtk-4.1 gtk3 libappindicator-gtk3 openssl \
            gst-plugins-base-libs gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav

      - name: Create build user
        run: |
          # makepkg refuses to run as root; the container has no other user.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          # actions/checkout ran as root, so hand the tree to builder for
          # makepkg's src/ and pkg/ dirs and to keep git happy about ownership.
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build
        working-directory: pkg/arch
        run: sudo -H -u builder makepkg -sf --noconfirm

      - name: Run check() (tests)
        working-directory: pkg/arch
        run: sudo -H -u builder makepkg -sf --check --noextract --noprepare --noconfirm

      - name: Inspect package contents
        working-directory: pkg/arch
        run: |
          ls -la *.pkg.tar.zst
          tar -tvf *.pkg.tar.zst | head -30

      - name: Upload .pkg.tar.zst
        uses: actions/upload-artifact@v4
        with:
          name: stratos-bar-pkg
          path: pkg/arch/*.pkg.tar.zst
          if-no-files-found: error
