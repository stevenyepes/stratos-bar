name: Arch package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: makepkg -s
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Update system
        run: |
          pacman -Syu --noconfirm
          # mkinitcpio and friends log warnings without a keyring refresh
          pacman-key --init
          pacman-key --populate archlinux

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -S --needed --noconfirm \
            base-devel git npm cargo nodejs \
            webkit2gtk-4.1 gtk3 libappindicator-gtk3 openssl \
            gst-plugins-base-libs gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav

      - name: Build
        working-directory: pkg/arch
        run: makepkg -sf --noconfirm

      - name: Run check() (tests)
        working-directory: pkg/arch
        run: makepkg -sf --check --noextract --noprepare --noconfirm

      - name: Inspect package contents
        working-directory: pkg/arch
        run: |
          ls -la *.pkg.tar.zst
          tar -tvf *.pkg.tar.zst | head -30

      - name: Upload .pkg.tar.zst
        uses: actions/upload-artifact@v4
        with:
          name: stratos-bar-pkg
          path: pkg/arch/*.pkg.tar.zst
          if-no-files-found: error
